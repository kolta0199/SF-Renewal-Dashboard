<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Renewal 2026–2028 | ELT Investment Decision</title>

<!-- Only three public libraries are loaded (React, ReactDOM, Babel). No data leaves this page. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

<style>
  :root{
    --ink:#F8FAFC; --ink2:#CBD5E1; --muted:#94A3B8; --faint:#64748B; --rule:#334155;
    --paper:#0F172A; --blue:#00A1E0; --bluet:rgba(0,161,224,0.15); --green:#10B981; --greent:rgba(16,185,129,0.15);
    --amber:#F59E0B; --ambert:rgba(245,158,11,0.15); --red:#EF4444; --hist:#94A3B8;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#050811;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  .stage{position:absolute;width:1600px;height:900px;background:var(--paper);transform-origin:top left;box-shadow:0 24px 70px rgba(0,0,0,0.5);display:flex;flex-direction:column;overflow:hidden}
  .serif{font-family:var(--serif)}
  .num{font-variant-numeric:tabular-nums}
  .kicker{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--blue)}
  .caps{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--faint)}
  .fade{animation:fade .45s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .btn{font-family:inherit;border:1px solid var(--rule);background:#1E293B;color:var(--ink);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:8px;cursor:pointer}
  .btn:hover:not(:disabled){border-color:#475569;background:#334155}
  .btn:disabled{opacity:.28;cursor:default}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.primary:hover:not(:disabled){background:#0284c7;border-color:#0284c7}
  .seg{background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-align:left}
  .row-h{transition:opacity .2s, background .2s}
  .drawer h3{font-family:var(--serif);font-size:20px;margin:22px 0 8px;font-weight:600}
  .drawer h3:first-child{margin-top:0}
  .drawer p,.drawer li{font-size:13.5px;line-height:1.55;color:var(--ink2)}
  .drawer ul{padding-left:18px;margin:6px 0}
  .drawer table{width:100%;border-collapse:collapse;font-size:12.5px}
  .drawer td{padding:6px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
  .drawer td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:15px var(--sans);color:var(--muted)}
</style>
</head>
<body>
<div id="root"><div id="boot">Loading presentation… (requires internet access to cdnjs.cloudflare.com)</div></div>

<script>
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (b) b.innerHTML = '<div style="color:#BA0517;max-width:700px">Error: ' + e.message + '</div>';
  });
</script>

<script type="text/babel" data-presets="react,env">
const { useState, useEffect } = React;

/* =====================================================================
   CENTRAL DATA MODEL — single source of truth (authoritative inputs)
   ===================================================================== */
const D = {
  previous: { period: '2024–2026', value: 760887.53, termMonths: 24 },
  interim: [
    { date: '2025-11', org: 'Customer Support', owner: "Angel's team", licenses: 100, type: 'Service Cloud', approxCost: 177000 },
    { date: '2026-04', org: 'Application Services', owner: "Rehmann's team", licenses: 115, type: 'Service Cloud', priceFrom: 94, priceTo: 88 }
  ],
  renewal: {
    start: 'Oct 18, 2026', end: 'Oct 17, 2028', termMonths: 24, quote: 'Q-12192450',
    total: 1603628.30, annualized: 801814.15, billing: 'Annual', payment: 'Net 30',
    initialProposal: 1683000 // approximate
  },
  coreLicenses: [
    { key: 'sales', label: 'Sales & related functions', qty: 155, color: '#005FB2', fg: '#fff' },
    { key: 'cs',    label: 'Customer Support',          qty: 100, color: '#00A1E0', fg: '#fff' },
    { key: 'as',    label: 'Application Services',      qty: 115, color: '#71C4EF', fg: '#0B1F33' }
  ],
  functions: [
    { name: 'Sales', sub: '', value: 866488.03, color: '#005FB2',
      context: '155 Sales & Service Cloud licenses · CRM, opportunity & account management, contracts' },
    { name: 'Product Support', sub: 'Customer Support', value: 343392.93, color: '#00A1E0',
      context: '100 Service Cloud licenses · case management, digital engagement, knowledge' },
    { name: 'Application Support', sub: 'Application Services', value: 393747.34, color: '#71C4EF',
      context: '115 Service Cloud licenses · application support cases & operational workflows' }
  ],
  lineItems: [
    { short: 'Sales & Service Cloud', name: 'Sales & Service Cloud – Enterprise Edition (Service)', qty: 155, total: 553498.80, unit: 148.79 },
    { short: 'Service Cloud', name: 'Service Cloud – Enterprise Edition', qty: 215, total: 493038.00, unit: 95.55 },
    { short: 'Full Copy Sandbox', name: 'Sandbox (Full Copy)', qty: 1, total: 170539.56, unit: null },
    { short: 'Quip', name: 'Quip for Customer 360', qty: 71, total: 87756.00, unit: 51.50 },
    { short: 'Lightning Platform Starter', name: 'Lightning Platform Starter – Enterprise Edition', qty: 125, total: 75000.00, unit: null },
    { short: 'Event Monitoring', name: 'Event Monitoring', qty: 1, total: 62531.17, unit: null },
    { short: 'Field Audit Trail', name: 'Field Audit Trail – LP1', qty: 1, total: 62531.17, unit: null },
    { short: 'Digital Engagement', name: 'Digital Engagement – Enterprise Edition – LP1', qty: 50, total: 51540.00, unit: 42.95 },
    { short: 'Salesforce Inbox', name: 'Salesforce Inbox – Enterprise Edition', qty: 100, total: 26400.00, unit: 11.00 },
    { short: 'Community Members', name: 'Customer Community – Enterprise Edition – Members', qty: 620, total: 14433.60, unit: 0.97 },
    { short: 'Knowledge', name: 'Knowledge', qty: 3, total: 5400.00, unit: null },
    { short: 'Community Logins', name: 'Customer Community – Enterprise Edition – Logins', qty: 100, total: 960.00, unit: 0.40 }
  ],
  utilization: { activeMin: 331, activeMax: 338, available: 39 },
  demand: { kalderos: 7, psHypercare: 12, other: 'SaaSOps, UAT and other support organizations' },
  uplift: { at370: '~5%', at350: '~9–12%' },
  optimization: { deFrom: 100, deTo: 50, chatterRemoved: 31 }
};

/* ---------- formatting ---------- */
const sum = a => a.reduce((x, y) => x + y, 0);
const r2 = v => Math.round(v * 100) / 100;
const usd0 = v => '$' + Math.round(v).toLocaleString('en-US');
const usd2 = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = v => '$' + (v / 1000).toFixed(1) + 'K';
const fmtM = v => '$' + (v / 1e6).toFixed(3) + 'M';
const fmtS = v => v >= 1000 ? fmtK(v) : '$' + Math.round(v);
const pct1 = v => v.toFixed(1) + '%';

/* ---------- derived values (computed, never hard-coded) ---------- */
const TOTAL = D.renewal.total;
const INCREASE = r2(TOTAL - D.previous.value);
const INCREASE_PCT = INCREASE / D.previous.value * 100;
const REDUCTION = D.renewal.initialProposal - TOTAL;
const SUPPORT_PCT = (D.functions[1].value + D.functions[2].value) / TOTAL * 100;
const CORE_TOTAL = sum(D.coreLicenses.map(c => c.qty));
const DEMAND = D.demand.kalderos + D.demand.psHypercare;

/* ---------- CFO validation ---------- */
const CHECKS = [
  { label: 'Line items reconcile to total', actual: r2(sum(D.lineItems.map(i => i.total))), expected: TOTAL, money: true },
  { label: 'Business allocation reconciles to total', actual: r2(sum(D.functions.map(f => f.value))), expected: TOTAL, money: true },
  { label: 'Core licenses 155 + 100 + 115', actual: CORE_TOTAL, expected: 370 },
  { label: 'Increase vs. previous contract', actual: INCREASE, expected: 842740.77, money: true },
  { label: 'Increase % (rounded)', actual: Math.round(INCREASE_PCT * 10) / 10, expected: 110.8 },
  { label: 'Identified demand 7 + 12', actual: DEMAND, expected: 19 },
  { label: 'Available capacity 370 − 331', actual: 370 - D.utilization.activeMin, expected: D.utilization.available }
].map(c => Object.assign({}, c, { ok: Math.abs(c.actual - c.expected) < 0.005 }));
console.table(CHECKS);

/* =====================================================================
   SHARED UI
   ===================================================================== */
const Check = ({ color = 'currentColor', size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 20 20" fill="none" style={{ flexShrink: 0, marginTop: 2 }}>
    <path d="M4 10.5l4 4 8-9" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
  </svg>
);

const Toggle = ({ options, value, onChange }) => (
  <div style={{ display: 'inline-flex', background: '#1E293B', borderRadius: 999, padding: 3 }}>
    {options.map(([v, l]) => (
      <button key={v} onClick={() => onChange(v)} style={{
        border: 0, cursor: 'pointer', padding: '6px 14px', borderRadius: 999, fontSize: 12.5, fontWeight: 700, fontFamily: 'inherit',
        background: value === v ? '#334155' : 'transparent', color: value === v ? 'var(--ink)' : 'var(--muted)',
        boxShadow: value === v ? '0 1px 3px rgba(0,0,0,.12)' : 'none'
      }}>{l}</button>
    ))}
  </div>
);

const Meta = ({ label, value }) => (
  <div>
    <div className="caps" style={{ fontSize: 10.5 }}>{label}</div>
    <div className="num" style={{ fontSize: 15.5, fontWeight: 700, marginTop: 3 }}>{value}</div>
  </div>
);

const Band = ({ headline, children, size = 34 }) => (
  <div style={{ background: '#1E293B', color: '#fff', border: '1px solid var(--rule)', borderRadius: 10, padding: '24px 36px', display: 'grid', gridTemplateColumns: '600px 1fr', gap: 44, alignItems: 'center' }}>
    <div className="serif" style={{ fontSize: size, lineHeight: 1.12, fontWeight: 600 }}>{headline}</div>
    <div style={{ fontSize: 17.5, lineHeight: 1.5, color: 'var(--ink2)' }}>{children}</div>
  </div>
);

/* =====================================================================
   PAGE 1 — HOW WE GOT HERE
   ===================================================================== */
const STAGES = [
  { date: 'Oct 2024', title: 'Original Renewal', owner: 'Primarily Sales — also Finance, Rebates & other users',
    value: '~' + fmtK(D.previous.value), note: '24-month renewal', color: '#94A3B8',
    points: ['Sales & Service Cloud', 'Lightning Platform', 'Restricted-use licenses'] },
  { date: 'Nov 2025', title: 'Customer Support Expansion', owner: "Customer Support · Angel's team",
    value: '+100', note: 'Service Cloud licenses · ~$177K interim', color: '#00A1E0',
    points: ['+ Digital Engagement', '+ Knowledge', '+ Sandbox', '+ Field Audit Trail'],
    tag: 'Co-termed to Oct 2026', tagBg: 'var(--bluet)', tagFg: 'var(--blue)' },
  { date: 'Apr 2026', title: 'Application Services Expansion', owner: "Application Services · Rehmann's team",
    value: '+115', note: 'Service Cloud licenses', color: '#71C4EF',
    points: ['+ Platform / sandbox services', 'Pricing ~$94 → ~$88 /user/month'],
    tag: 'Improved pricing based on prior commitments', tagBg: 'var(--greent)', tagFg: 'var(--green)' },
  { date: 'Oct 2026', title: 'Consolidated Renewal', owner: 'Sales · Customer Support · Application Services',
    value: fmtM(TOTAL), note: '24 months · 370 core Sales / Service licenses', color: 'var(--blue)', current: true,
    points: ['One co-termed enterprise renewal'],
    tag: 'Decision required', tagBg: 'var(--ambert)', tagFg: 'var(--amber)' }
];

const LANES = [
  { start: 1, label: 'Sales + Finance, Rebates & other business users', count: 155, color: '#005FB2', fg: '#fff' },
  { start: 2, label: 'Customer Support', count: 100, color: '#00A1E0', fg: '#fff' },
  { start: 3, label: 'Application Services', count: 115, color: '#71C4EF', fg: '#0B1F33' }
];

const Page1 = () => {
  const [hover, setHover] = useState(null);
  const colW = (1472 - 3 * 40) / 4;
  return (
    <div className="fade" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      {/* Timeline */}
      <div style={{ position: 'relative' }}>
        <div style={{ position: 'absolute', left: 11, width: 3 * (colW + 40), top: 41, height: 3, borderRadius: 2,
          background: 'linear-gradient(90deg,#B9C0C9,#2F7FD3 45%,#0B5CAB)' }} />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 40 }}>
          {STAGES.map((s, i) => (
            <div key={i} className="row-h" onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
              style={{ position: 'relative', opacity: hover === null || hover === i ? 1 : 0.42 }}>
              <div style={{ fontSize: 14, fontWeight: 800, letterSpacing: '.18em', color: s.color }}>{s.date.toUpperCase()}</div>
              <div style={{ marginTop: 10, width: 25, height: 25, borderRadius: '50%', boxSizing: 'border-box',
                background: s.current ? 'var(--blue)' : 'var(--paper)', border: '4px solid ' + s.color,
                boxShadow: s.current ? '0 0 0 6px rgba(11,92,171,.15)' : 'none' }} />
              <div className="serif" style={{ fontSize: 24, fontWeight: 600, marginTop: 16, lineHeight: 1.15 }}>{s.title}</div>
              <div style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 5 }}>{s.owner}</div>
              <div className="serif num" style={{ fontSize: s.current ? 52 : 44, fontWeight: 600, color: s.color, marginTop: 14, lineHeight: 1, letterSpacing: '-.01em' }}>{s.value}</div>
              <div style={{ fontSize: 13.5, color: 'var(--ink2)', marginTop: 8, fontWeight: 700 }}>{s.note}</div>
              <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 8, lineHeight: 1.5 }}>{s.points.join('  ·  ')}</div>
              {s.tag && <div style={{ marginTop: 10, display: 'inline-block', fontSize: 11.5, fontWeight: 800, padding: '4px 10px', borderRadius: 999, background: s.tagBg, color: s.tagFg }}>{s.tag}</div>}
            </div>
          ))}
        </div>
      </div>

      {/* Business footprint lanes */}
      <div style={{ marginTop: 24 }}>
        <div className="caps" style={{ marginBottom: 10 }}>Business functions on Salesforce</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', columnGap: 40, rowGap: 8 }}>
          {LANES.map((l, i) => (
            <div key={i} style={{ gridColumn: l.start + ' / 5', gridRow: i + 1, height: 34, borderRadius: 6, background: l.color, color: l.fg,
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 14px', fontSize: 13.5, fontWeight: 700 }}>
              <span>{l.label}</span>
              <span className="num">{l.count}<span style={{ fontWeight: 500, opacity: .8, marginLeft: 5 }}>licenses (2026)</span></span>
            </div>
          ))}
          <div style={{ gridColumn: '1 / 4', gridRow: 4, fontSize: 12, color: 'var(--faint)', alignSelf: 'center' }}>
            License counts reflect the 2026 renewal. Historical license quantities and a dollar bridge between stages are not separately available.
          </div>
          <div className="num" style={{ gridColumn: '4 / 5', gridRow: 4, textAlign: 'right', fontSize: 14, fontWeight: 800 }}>
            155 + 100 + 115 = <span style={{ color: 'var(--blue)' }}>370 core licenses</span>
          </div>
        </div>
      </div>

      <div style={{ marginTop: 'auto' }}>
        <Band headline={<span>The story is expansion,<br />not just price.</span>} size={36}>
          Salesforce evolved from a primarily Sales-oriented platform into an enterprise platform supporting
          <b style={{ color: '#fff' }}> Sales, Customer Support and Application Services.</b>
        </Band>
      </div>
    </div>
  );
};

/* =====================================================================
   PAGE 2 — WHAT WE ARE BUYING NOW
   ===================================================================== */
const Page2 = () => {
  const [mode, setMode] = useState('24');
  const [fn, setFn] = useState(null);
  const [hov, setHov] = useState(null);
  const [pin, setPin] = useState(null);
  const div = mode === '24' ? 1 : 2;
  const maxFn = Math.max.apply(null, D.functions.map(f => f.value));
  const items = D.lineItems.slice().sort((a, b) => b.total - a.total);
  const active = hov !== null ? hov : pin;
  const it = active !== null ? items[active] : null;
  const af = fn !== null ? D.functions[fn] : null;

  return (
    <div className="fade" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '480px 1fr', gap: 64 }}>
        {/* LEFT: commitment + footprint */}
        <div>
          <div className="caps">24-month commitment</div>
          <div className="serif num" style={{ fontSize: 108, fontWeight: 600, lineHeight: 1, marginTop: 6, letterSpacing: '-.02em' }}>{fmtM(TOTAL)}</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.3fr', gap: '14px 24px', marginTop: 20 }}>
            <Meta label="Annualized" value={fmtK(D.renewal.annualized)} />
            <Meta label="Term" value={D.renewal.start + ' – ' + D.renewal.end} />
            <Meta label="Billing · Payment" value={D.renewal.billing + ' · ' + D.renewal.payment} />
            <Meta label="Quote" value={D.renewal.quote} />
          </div>
          <div style={{ height: 1, background: 'var(--rule)', margin: '26px 0 22px' }} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <div className="serif num" style={{ fontSize: 80, fontWeight: 600, color: 'var(--blue)', lineHeight: 1 }}>{CORE_TOTAL}</div>
            <div style={{ fontSize: 13.5, fontWeight: 800, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--ink2)', lineHeight: 1.35 }}>Core Sales /<br />Service licenses</div>
          </div>
          <div style={{ display: 'flex', height: 42, borderRadius: 6, overflow: 'hidden', marginTop: 18 }}>
            {D.coreLicenses.map(c => (
              <div key={c.key} style={{ width: (c.qty / CORE_TOTAL * 100) + '%', background: c.color, color: c.fg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 17 }} className="num">{c.qty}</div>
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '155fr 100fr 115fr', marginTop: 10, fontSize: 12.5, color: 'var(--muted)', lineHeight: 1.3 }}>
            {D.coreLicenses.map(c => (
              <div key={c.key} style={{ paddingRight: 8, display: 'flex', gap: 6 }}>
                <span style={{ width: 9, height: 9, background: c.color, borderRadius: 2, marginTop: 3, flexShrink: 0 }} />{c.label}
              </div>
            ))}
          </div>
        </div>

        {/* RIGHT: investment by function + where the money goes */}
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div className="serif" style={{ fontSize: 25, fontWeight: 600 }}>Investment by business function</div>
            <Toggle options={[['24', '24-Month'], ['12', 'Annualized']]} value={mode} onChange={setMode} />
          </div>
          <div style={{ marginTop: 12 }}>
            {D.functions.map((f, i) => (
              <div key={f.name} className="row-h" onMouseEnter={() => setFn(i)} onMouseLeave={() => setFn(null)}
                style={{ display: 'grid', gridTemplateColumns: '200px 1fr 200px', alignItems: 'center', gap: 18, padding: '7px 0', cursor: 'default', opacity: fn === null || fn === i ? 1 : 0.45 }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 800 }}>{f.name}</div>
                  {f.sub && <div style={{ fontSize: 12, color: 'var(--faint)', fontWeight: 600 }}>{f.sub}</div>}
                </div>
                <div style={{ height: 30, background: '#1E293B', borderRadius: 4 }}>
                  <div style={{ width: (f.value / maxFn * 100) + '%', height: '100%', background: f.color, borderRadius: 4 }} />
                </div>
                <div style={{ textAlign: 'right' }}>
                  <span className="num" style={{ fontSize: 21, fontWeight: 800 }}>{usd0(f.value / div)}</span>
                  <span className="num" style={{ fontSize: 14, color: 'var(--muted)', marginLeft: 10, fontWeight: 700 }}>{pct1(f.value / TOTAL * 100)}</span>
                </div>
              </div>
            ))}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid var(--rule)', marginTop: 6, paddingTop: 10 }}>
              <div style={{ fontSize: 13, color: af ? 'var(--ink)' : 'var(--faint)', fontWeight: af ? 700 : 500, minHeight: 18 }}>
                {af ? af.context : 'Hover a function to see its license footprint.'}
              </div>
              <div className="num" style={{ fontSize: 14, fontWeight: 800 }}>Total {usd0(TOTAL / div)}{mode === '12' ? ' / yr' : ''}</div>
            </div>
          </div>

          <div style={{ marginTop: 14, display: 'flex', alignItems: 'center', gap: 16, background: 'var(--bluet)', borderRadius: 8, padding: '12px 18px' }}>
            <div className="serif num" style={{ fontSize: 34, fontWeight: 600, color: 'var(--blue)', lineHeight: 1 }}>{pct1(SUPPORT_PCT)}</div>
            <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink2)' }}>of the investment supports <b>Product + Application Support</b> — functions that were not on Salesforce in 2024.</div>
          </div>

          <div style={{ marginTop: 20 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
              <div className="caps">Where the money goes · 24-month line items</div>
              <div className="num" style={{ fontSize: 12, color: 'var(--green)', fontWeight: 700 }}>✓ Reconciles to {usd2(CHECKS[0].actual)}</div>
            </div>
            <div style={{ display: 'grid', gridAutoFlow: 'column', gridTemplateRows: 'repeat(6, 25px)', gridTemplateColumns: '1fr 1fr', columnGap: 40, marginTop: 8 }}>
              {items.map((x, i) => (
                <div key={x.short} onMouseEnter={() => setHov(i)} onMouseLeave={() => setHov(null)} onClick={() => setPin(pin === i ? null : i)}
                  style={{ display: 'grid', gridTemplateColumns: '180px 1fr 64px', alignItems: 'center', gap: 10, cursor: 'pointer', fontSize: 13 }}>
                  <div style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', fontWeight: active === i ? 800 : 500, color: active === i ? 'var(--ink)' : 'var(--ink2)' }}>{x.short}</div>
                  <div style={{ height: 7, background: '#1E293B', borderRadius: 4 }}>
                    <div style={{ width: Math.max(0.6, x.total / items[0].total * 100) + '%', height: '100%', borderRadius: 4, background: active === i ? 'var(--blue)' : '#9DBCE0' }} />
                  </div>
                  <div className="num" style={{ textAlign: 'right', fontWeight: 700 }}>{fmtS(x.total)}</div>
                </div>
              ))}
            </div>
            <div className="num" style={{ marginTop: 8, fontSize: 12.5, minHeight: 18, color: it ? 'var(--ink)' : 'var(--faint)' }}>
              {it ? (

  { short: 'What we are buying', kicker: 'What we are buying now', title: '2026–2028 Renewal: What the $1.604M Commitment Supports',
    subtitle: 'Consolidated 24-month Salesforce renewal across three business functions', C: Page2 },
  { short: 'The decision', kicker: 'Why this renewal · Executive decision', title: 'Renewal Economics & Executive Decision',
    subtitle: 'Why we recommend approving the 24-month renewal at 370 licenses', C: Page3 },
  { short: 'Capability map', kicker: 'Reference · What each license is for', title: 'Salesforce Capability Map',
    subtitle: 'What the organization is actually using the platform for', C: Page4 }
];

const initialPage = () => {
  const n = parseInt((window.location.hash || '').replace('#', ''), 10);
  return n >= 1 && n <= 4 ? n : 1;
};

const App = () => {
  const [page, setPage] = useState(initialPage);
  const [detail, setDetail] = useState(false);
  const [box, setBox] = useState({ k: 1, x: 0, y: 0 });

  useEffect(() => {
    const fit = () => {
      const k = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      setBox({ k, x: (window.innerWidth - 1600 * k) / 2, y: (window.innerHeight - 900 * k) / 2 });
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  useEffect(() => {
    const onKey = e => {
      if (['ArrowRight', 'PageDown'].includes(e.key) || e.key === ' ') { e.preventDefault(); setPage(p => Math.min(4, p + 1)); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); setPage(p => Math.max(1, p - 1)); }
      else if (['1', '2', '3', '4'].includes(e.key)) setPage(parseInt(e.key, 10));
      else if (e.key === 'd' || e.key === 'D') setDetail(v => !v);
      else if (e.key === 'Escape') setDetail(false);
      else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        else document.exitFullscreen && document.exitFullscreen();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => { try { history.replaceState(null, '', '#' + page); } catch (e) {} }, [page]);

  const P = PAGES[page - 1];
  const Body = P.C;

  return (
    <div className="stage" style={{ transform: 'scale(' + box.k + ')', left: box.x, top: box.y }}>
      <header style={{ height: 124, boxSizing: 'border-box', padding: '26px 64px 0', borderBottom: '1px solid var(--rule)', display: 'flex', justifyContent: 'space-between' }}>
        <div>
          <div className="kicker">0{page} · {P.kicker}</div>
          <h1 className="serif" style={{ fontSize: 34, fontWeight: 600, margin: '8px 0 0', lineHeight: 1.15, letterSpacing: '-.01em' }}>{P.title}</h1>
          <div style={{ fontSize: 15.5, color: 'var(--muted)', marginTop: 5 }}>{P.subtitle}</div>
        </div>
        <div style={{ textAlign: 'right', paddingTop: 2 }}>
          <div className="caps">Salesforce Renewal · ELT</div>
          <div className="num" style={{ fontSize: 12.5, color: 'var(--faint)', marginTop: 4 }}>Quote {D.renewal.quote}</div>
        </div>
      </header>

      <main key={page} style={{ flex: 1, minHeight: 0, padding: '22px 64px 22px', position: 'relative' }}>
        <Body />
      </main>

      {detail && (
        <div className="drawer fade" style={{ position: 'absolute', top: 124, bottom: 56, right: 0, width: 480, boxSizing: 'border-box', background: '#151e32', borderLeft: '1px solid var(--rule)', boxShadow: '-24px 0 48px rgba(11,31,51,.10)', padding: '26px 32px', overflowY: 'auto', zIndex: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <div className="kicker">Detail view</div>
            <button className="btn" style={{ padding: '4px 10px', fontSize: 12 }} onClick={() => setDetail(false)}>Close ✕</button>
          </div>
          {DETAILS[page - 1]()}
        </div>
      )}

      <footer style={{ height: 56, boxSizing: 'border-box', borderTop: '1px solid var(--rule)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 64px', background: '#0B1121' }}>
        <button className="btn" disabled={page === 1} onClick={() => setPage(p => Math.max(1, p - 1))}>← Previous</button>
        <div style={{ display: 'flex', alignItems: 'center', gap: 26 }}>
          <div style={{ display: 'flex', gap: 10 }}>
            {PAGES.map((p, i) => (
              <button key={p.short} className="seg" onClick={() => setPage(i + 1)}>
                <div style={{ height: 3, width: 132, borderRadius: 2, background: page === i + 1 ? 'var(--blue)' : (i + 1 < page ? '#A9C5E6' : 'var(--rule)') }} />
                <div style={{ fontSize: 11.5, fontWeight: 700, marginTop: 6, color: page === i + 1 ? 'var(--ink)' : 'var(--faint)' }}>{p.short}</div>
              </button>
            ))}
          </div>
          <div className="num" style={{ fontSize: 15, fontWeight: 800, minWidth: 40 }}>{page} / 4</div>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <button className="btn" onClick={() => setDetail(v => !v)} title="Keyboard: D">{detail ? 'Hide detail' : 'Detail view'}</button>
          <button className="btn primary" disabled={page === 4} onClick={() => setPage(p => Math.min(4, p + 1))}>Next →</button>
        </div>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
